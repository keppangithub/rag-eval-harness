[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Eval harness for a RAG chatbot: how to test a non-deterministic AI feature."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-llms-openai>=0.8.3",
    "markdownify>=1.2.3",
    "pydantic-ai-slim[openai]>=2.31.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "legacy"  # keeps record_property data in the XML output
markers = [
    "fast: no chat model calls, deterministic, runs on every push",
    "llm: calls OpenAI chat models, costs money, non-deterministic",
]
